<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>My To-Do List</h1>
        <p>Stay organized and get things done</p>
      </header>

      <form class="todo-form" id="todo-form">
        <input
          type="text"
          class="todo-input"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
        <button type="submit" class="todo-add-btn">Add</button>
      </form>

      <div class="todo-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <div class="todo-stats" id="todo-stats" style="display:none">
        <span id="remaining-count"></span>
        <button class="clear-completed" id="clear-completed" disabled>Clear completed</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
